content:
  
      title: Makronen
      description: Aus Mamas Kochbuch von Burda
      ingredients:
        - Eiweis von 3-4 Eiern
        - 1 Esslöffel Zitronensaft
        - 250g Puderzucker
        - 1/2 TL Salz
        - 1/2 Fläschchen Bittermandel
        - 300 - 350 gr Mandeln (je nach Größe der Eier / Konsistenz des Teigs)
      instructions:
        - Schritt 1: Eiweis von 3-4 Eiern steif schlagen mit 1 Esslöffel Zitronensaft.
        - 250g Puderzucker, 1/2 TL Salz und 1/2 Fläschchen Bittermandel dazugeben und weiterschlagen.
        - Mandeln nach und nach unterheben, bis ein zäher Teig entsteht.
        - Mit 2 Teelöffeln kleine Häufchen auf ein mit Backpapier ausgelegtes Backblech setzen.
        - Im vorgeheizten Backofen bei 150 Grad (Umluft 130 Grad) ca. 15-20 Minuten backen, bis sie leicht goldbraun sind.
        - Abkühlen lassen und genießen!
      prep_time: 15 Minuten
      cook_time: 15-20 Minuten
      servings: 4 Portionen
      category: Dessert
      cuisine: International
       
